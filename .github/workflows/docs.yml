name: Documentation
on:
  push:
    branches:
      - master
      - main
  # Manual redeploy: GitHub Pages deployments fail transiently service-side
  # ("Deployment failed, try again later"), and re-running a failed Pages run
  # duplicates the github-pages artifact, which deploy-pages rejects. A fresh
  # dispatch is the correct retry.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # workflow_dispatch can be invoked against any ref; Pages must only ever
    # deploy from the default branch (dispatch from main to retry a transient
    # Pages-service failure — that is the sole intended manual use).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      # Build with the exact toolchain uv.lock pins for the local `nox -s docs`
      # build, transitive dependencies included: an unpinned zensical (and
      # then pymdown-extensions under it) drifted to releases that reject
      # this site's configuration. The constraints track uv.lock on their own.
      - run: uv export --frozen --no-hashes --no-emit-project --only-group dev --output-file docs-constraints.txt
      - run: pip install -c docs-constraints.txt zensical mkdocstrings mkdocstrings-python
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
