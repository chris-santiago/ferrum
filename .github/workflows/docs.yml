name: Documentation
on:
  push:
    branches:
      - master
      - main
  # Manual redeploy: GitHub Pages deployments fail transiently service-side
  # ("Deployment failed, try again later"), and re-running a failed Pages run
  # duplicates the github-pages artifact, which deploy-pages rejects. A fresh
  # dispatch is the correct retry.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # workflow_dispatch can be invoked against any ref; Pages must only ever
    # deploy from the default branch (dispatch from main to retry a transient
    # Pages-service failure — that is the sole intended manual use).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical mkdocstrings mkdocstrings-python
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
