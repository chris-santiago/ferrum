# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: wheel ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.manylinux }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux glibc (manylinux2014 = glibc 2.17: CentOS 7, Amazon Linux 2,
          #     Ubuntu 18.04+, Debian 10+ — matches polars' broad reach) ---
          - { platform: linux,   runner: ubuntu-latest,  target: x86_64,  manylinux: '2014' }
          - { platform: linux,   runner: ubuntu-latest,  target: aarch64, manylinux: '2014' }
          # --- Linux musl (Alpine 3.13+) ---
          - { platform: musllinux, runner: ubuntu-latest, target: x86_64,  manylinux: musllinux_1_2 }
          - { platform: musllinux, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # --- macOS (Intel + Apple Silicon) ---
          - { platform: macos,   runner: macos-13,       target: x86_64,  manylinux: auto }
          - { platform: macos,   runner: macos-14,       target: aarch64, manylinux: auto }
          # --- Windows ---
          - { platform: windows, runner: windows-latest, target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ferrum-viz
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          # Allow backfilling new platform wheels onto an already-published
          # version: existing files (e.g. the macOS-arm64 / win_amd64 wheels
          # from a prior run) are skipped instead of failing the upload.
          # No-op on a fresh release (nothing exists yet).
          skip-existing: true
