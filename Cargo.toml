[workspace]
resolver = "2"
members = ["crates/ferrum-core", "crates/ferrum-scene", "crates/ferrum-wasm"]
default-members = ["crates/ferrum-core", "crates/ferrum-scene"]

[workspace.package]
version = "0.20.2"
edition = "2021"
license = "MIT"
authors = ["Chris Santiago <cjsantiago@gatech.edu>"]
repository = "https://github.com/chris-santiago/ferrum"

[workspace.dependencies]
pyo3       = { version = "0.28", features = ["abi3-py310"] }
# pyo3-arrow 0.17.0 declares pyo3 = "^0.28" — compatible with our pinned PyO3 version.
# It internally uses arrow-* = "^58", so arrow must also be 58.x.
# Note: PyRecordBatchReader::into_reader() in 0.17.0 does NOT require a Python<'_> GIL
# token — it returns a plain arrow RecordBatchReader. Task 6 implementer: no GIL token needed.
pyo3-arrow = { version = "0.17", default-features = false }
# default-features = false disables pyo3-arrow's `buffer_protocol` feature, which uses
# pyo3::buffer — unavailable under Py_LIMITED_API (abi3-py310). CDI via PyCapsule
# (__arrow_c_stream__) is unaffected; it does not use the buffer protocol.
# arrow 58.x is the apache/arrow-rs meta-crate; default-features = false keeps the binary
# lean — we pull only core types plus IPC support. RecordBatch, Schema, and
# RecordBatchIterator are available without additional features.
arrow      = { version = "58", default-features = false, features = ["ipc"] }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Phase 5 (stat-engine) — seeded reproducible RNG for bootstrap CI.
# rand provides RNG traits; rand_chacha provides ChaCha8Rng (deterministic, seeded,
# reproducible across platforms — required for committed numeric-reference fixtures).
rand        = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = { version = "0.3", default-features = false }
# Phase 7 (static-renderer) — exact pin per spec §8.
# fontdue version bumps change glyph advances; refresh goldens via FERRUM_UPDATE_GOLDENS=1.
fontdue = "=0.9.3"
# Color type alias + future colorspace conversions. Range pin per spec §11 row 6.
palette = "~0.7"
# Phase 8b — perceptually-uniform sequential/diverging color ramps for stat marks.
colorous = "1"
# SVG → typed tree → tiny_skia rasterization. usvg/resvg minor versions must match.
usvg    = "~0.47"
resvg   = "~0.47"
# tiny-skia: pixel buffer + transform types used by resvg::render. Pinned to the
# version resvg 0.47 depends on so we share a single Pixmap/Transform ABI.
tiny-skia = "~0.12"
# base64 @font-face data URL emission for Phase 7 SVG embed.
base64  = "~0.22"
# Phase 8b — direct PNG encode path for raster export (promoted from transitive).
png     = "0.18"
# Phase 9 (Linkage transform) — scipy-compatible Lance-Williams + nearest-neighbor
# chain. Pure Rust, single-purpose, audited per Task 1 verify-before-implementing
# (last release April 2025, MIT, 7 methods supported, no correctness/panic issues).
kodama = "0.3"
# Phase 9 (Jitter seed-fallback hash) — twox-hash 1.x (NOT 2.x, which has a
# different API surface). Used by render/position.rs to derive a deterministic
# u64 from (x, y, group) per row when the user passes seed=None.
twox-hash = { version = "1.6", default-features = false }
# Pure-Rust linear algebra (Cholesky, QR, SVD, eigendecomposition). Zero
# external dependencies — no LAPACK, no OpenBLAS, no platform-specific linking.
# Used for hat-matrix diagonals, correlation matrices, and consolidating
# hand-rolled 2x2/3x3 solvers across glm/logistic/robust/smooth transforms.
faer = "0.24"
# Phase 10: manifolds-rs for Rust-native t-SNE and UMAP embeddings.
# manifolds-rs 0.2.4 depends on faer 0.23; our workspace uses faer 0.24.
# faer-compat is a renamed faer 0.23 dep used solely at the manifolds-rs
# interop boundary — construct a faer-0.23 MatRef to pass into manifolds_rs
# functions, then read back the output as plain Vec<Vec<f64>>.
# TODO: remove faer-compat when manifolds-rs supports faer >=0.24.
manifolds-rs = { version = "0.2", default-features = false }
faer-compat = { package = "faer", version = "0.23.2" }
# Phase 11b (WASM renderer) — GPU rendering in the browser.
wgpu              = { version = "29", default-features = false, features = ["webgl", "wgsl"] }
wasm-bindgen      = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }
web-sys           = { version = "0.3", features = [
    "HtmlCanvasElement", "Window", "Document", "Element",
    "console", "CssStyleDeclaration",
] }
js-sys            = { version = "0.3" }
lyon              = { version = "1" }
bytemuck          = { version = "1", features = ["derive"] }
console_error_panic_hook = { version = "0.1" }

[profile.release]
lto = "thin"
codegen-units = 1
