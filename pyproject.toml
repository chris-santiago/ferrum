[project]
name = "ferrum"
version = "0.1.0"
description = "Ferrum is a statistical visualization library for Python: a grammar-first charting system that unifies exploratory plots, statistical graphics, interactive views, and model diagnostics, backed by a Rust engine."
readme = "README.md"
authors = [
    { name = "chris-santiago", email = "cjsantiago@gatech.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "narwhals>=1.0,<2",
    "numpy>=1.20",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.3"]
shap = ["scikit-learn>=1.3", "shap>=0.42"]
ml-all = ["scikit-learn>=1.3", "shap>=0.42"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "ferrum._core"
manifest-path = "crates/ferrum-core/Cargo.toml"
python-source = "src"
features = ["extension-module"]
strip = true
include = [
    { path = "src/ferrum/_wasm/*.wasm", format = "sdist" },
    { path = "src/ferrum/_wasm/*.js", format = "sdist" },
    { path = "src/ferrum/_wasm/*.css", format = "sdist" },
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8",
    "scipy>=1.10",
    "skops>=0.9",
    "resvg-py>=0.3",
    "zensical>=0.0.40",
    "ruff>=0.6",
    "ipykernel>=7.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Permanent exemptions:
"src/ferrum/_*.py" = ["D"]
"src/ferrum/marks/**" = ["D"]  # internal-only subpackage; not in __all__
"tests/**" = ["D"]
"src/ferrum/_core.pyi" = ["D"]
