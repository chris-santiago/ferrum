[project]
name = "ferrum"
version = "0.1.0"
description = "A grammar-of-graphics statistical visualization library with a Rust core"
readme = "README.md"
authors = [
    { name = "chris-santiago", email = "cjsantiago@gatech.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "narwhals>=1.0,<2",
    "numpy>=1.20",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.3"]
shap = ["scikit-learn>=1.3", "shap>=0.42"]
umap = ["scikit-learn>=1.3", "umap-learn>=0.5"]
ml-all = ["scikit-learn>=1.3", "shap>=0.42", "umap-learn>=0.5"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "ferrum._core"
manifest-path = "crates/ferrum-core/Cargo.toml"
python-source = "src"
features = ["extension-module"]
strip = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["maturin>=1.7,<2.0", "pytest>=8", "scipy>=1.10", "skops>=0.9"]
