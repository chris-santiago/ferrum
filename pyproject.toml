[project]
name = "ferrum-viz"
version = "0.15.1"
description = "Ferrum is a statistical visualization library for Python: a grammar-first charting system that unifies exploratory plots, statistical graphics, interactive views, and model diagnostics, backed by a Rust engine."
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "chris-santiago", email = "cjsantiago@gatech.edu" }
]
requires-python = ">=3.10"
keywords = ["visualization", "plotting", "grammar-of-graphics", "charts", "rust", "statistics", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "narwhals>=1.0,<2",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://ferrumviz.com"
Documentation = "https://ferrumviz.com"
Repository = "https://github.com/chris-santiago/ferrum"
Issues = "https://github.com/chris-santiago/ferrum/issues"

[project.optional-dependencies]
models = ["scikit-learn>=1.3"]
shap = ["scikit-learn>=1.3", "shap>=0.42"]
jupyter = ["anywidget>=0.9"]
all = ["scikit-learn>=1.3", "shap>=0.42", "anywidget>=0.9"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "ferrum._core"
manifest-path = "crates/ferrum-core/Cargo.toml"
python-source = "src"
features = ["extension-module"]
strip = true
include = [
    { path = "src/ferrum/_wasm/*.wasm", format = "sdist" },
    { path = "src/ferrum/_wasm/*.js", format = "sdist" },
    { path = "src/ferrum/_wasm/*.css", format = "sdist" },
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "slow: scale/performance tests (10k–50k rows) — skipped by default, run with: pytest -m slow",
]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-codeblocks>=0.17",
    "scipy>=1.10",
    "skops>=0.9",
    "resvg-py>=0.3",
    "zensical>=0.0.40",
    "mkdocstrings>=1.0",
    "mkdocstrings-python>=2.0",
    "ruff>=0.6",
    "ipykernel>=7.2.0",
    "nox>=2026.4.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D205",  # 1 blank line required between summary and description — not enforced
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D301",  # use r-strings for backslashes — too strict for docstrings with \n examples
    "D102",  # public method docstrings — class-level docstrings cover dataclass methods
    "D105",  # magic method docstrings — __post_init__, __new__, etc. have implicit contracts
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Permanent exemptions:
"src/ferrum/_*.py" = ["D"]
"src/ferrum/marks/**" = ["D"]  # internal-only subpackage; not in __all__
"tests/**" = ["D"]
"src/ferrum/_core.pyi" = ["D"]
